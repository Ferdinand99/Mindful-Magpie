[package]
name = "mindful-magpie"
# release-please bumps this; the first feature release makes it 0.1.0.
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/Ferdinand99/Mindful-Magpie"
description = "A self-hosted start page for your links and services."
publish = false

[[bin]]
name = "mindful-magpie"
path = "src/main.rs"

[dependencies]
# The shared product kit (auth, users, setup, i18n, db, HTTP, settings, design
# system). Locally, a .cargo/config.toml [patch] can point it at a checkout of
# the Vigilant Vole repository (docs/development.md).
vole-kit = { git = "https://github.com/Ferdinand99/Vigilant-Vole", tag = "vole-kit-v0.8.0" }
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed", "form"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8.12.0"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[build-dependencies]
# Copies the kit's templates into templates/kit/ for askama (build.rs).
vole-kit-build = { git = "https://github.com/Ferdinand99/Vigilant-Vole", tag = "vole-kit-v0.8.0" }

[dev-dependencies]
# Opens /setup without a setup token in the in-process tests, and brings the
# software passkey authenticator.
vole-kit = { git = "https://github.com/Ferdinand99/Vigilant-Vole", tag = "vole-kit-v0.8.0", features = ["test-support"] }
serde_json = "1.0.151"
tower = "0.5.3"
