# Mindful Magpie's own interface strings (English, the source). Core strings
# (sign-in, setup, users, tokens, Security, General, the layout) come from
# vole-kit; a key may live in only one of the two.

[start]
title = "Start"
sub = "Your links and services in one place."
needs = "Needs you"
date = "{weekday}, {day_month}"
empty = "Your start page is empty. Edit it to add services and bookmarks."
groups = "Services and bookmarks"
corrupt = "Your start page could not be read. It may have been changed outside Mindful Magpie. You can start over with an empty page."
corrupt_reset = "Start over"
invalid_link = "invalid link"
group_label = "Group: {title}"
bookmarks_label = "Bookmarks"

[connect]
title = "Connect the browser extension"
prompt = "Give {device} access to read your start page?"
help = "It can only read your start page, nothing else. You can take the access away at any time under Settings → API tokens."
approve = "Approve"
cancel = "Cancel"
refused_title = "Can't connect"
refused = "This connection request is not valid, so nothing was shared. Start the connection again from the extension."

# Texts the kit's pages take from the product
# (vole_kit::i18n::catalog::PRODUCT_KEYS).

[login]
subtitle = "Welcome back. Log in to open your start page."

[setup]
site_name_placeholder = "Home start page…"
tz_after = ". You can change this in Settings."

[users]
roles_help = "Everyone arranges their own start page. Viewers can't change anything else; editors can also change shared settings; admins can do everything, including users."

[tokens]
sub = "Let scripts and AI assistants read your start page."
scope_read_sub = "Links and services on the start page"

[auth]
all_set = "You’re all set. Your start page is ready."
setup_token_required = "This instance needs a setup token. Open /setup?token=… with the value of MM_SETUP_TOKEN from the server’s configuration, or use the setup link in the server log (`docker logs`)."

[error]
back = "Back to the start page"

# Texts of the kit's General page
# (vole_kit::i18n::catalog::GENERAL_PRODUCT_KEYS).

[general]
sub = "How this instance names itself, where it is reached and how it tells time."
base_url_help = "Where people reach this instance: used in links. If MM_PUBLIC_URL is set on the server, it replaces this at every start."
